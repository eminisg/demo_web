<section class="card mt-3">
  <form class="form flex-column d-flex card-body" [formGroup]="form" (ngSubmit)="submitProcess()" >
    <label class="form-label">
      Username
      <input class="form-control" type="text" formControlName="username">
    </label>
    <label>
      Password
      <input class="form-control" type="password" formControlName="password">
    </label>
    <div class="mt-3 d-flex">
      <button type="submit" class="btn btn-primary w-100">
        SIGN IN
      </button>
    </div>
  </form>
</section>
<button type="button" class="btn btn-outline-secondary mt-3" routerLink="/auth/sign-up">TO SIGN UP</button>

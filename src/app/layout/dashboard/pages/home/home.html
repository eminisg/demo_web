@if (userListPageable.hasValue()) {
  @let userList = userListPageable.value().content;
  <ul class="list-unstyled my-3">
    @for (user of userList; track $index) {
      <li class="shadow p-3 rounded-4 mb-3">
        <div class="d-flex">
          <app-img-loc [imgData]="user.profileImg" ></app-img-loc>
          <span class="ms-2">{{user.username}}</span>
        </div>
      </li>
    }
  </ul>
}
